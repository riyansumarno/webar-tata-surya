<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Tes Kamera Fullscreen — v4</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}video{position:fixed;inset:0;width:100vw;height:100dvh;object-fit:cover;background:#000}.start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:#07101a}.card{width:min(520px,100%);padding:20px;border:1px solid #26384c;border-radius:20px;background:#0a1624}.bar{position:fixed;z-index:30;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;gap:8px;justify-content:space-between;pointer-events:none}.bar>*{pointer-events:auto}.bottom{position:fixed;z-index:30;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));padding:10px;border-radius:16px;background:rgba(3,8,14,.78);backdrop-filter:blur(8px)}.btn{border:1px solid rgba(255,255,255,.24);border-radius:999px;background:#081522;color:#fff;padding:10px 13px;text-decoration:none;font-weight:750}.btn.primary{background:#fff;color:#07111d}.select{width:100%;padding:10px;border-radius:12px;background:#07111d;color:#fff;border:1px solid #33455a}.diag{font-size:12px;line-height:1.45;color:#d1dcea;margin-top:8px;white-space:pre-wrap}.hidden{display:none!important}</style></head><body>
<video id="video" playsinline webkit-playsinline muted autoplay></video>
<div id="start" class="start"><div class="card"><h1>Tes Kamera Fullscreen</h1><p>Halaman ini tidak memakai AR.js. Kamera harus memenuhi seluruh layar dan tetap menyala.</p><button id="go" class="btn primary">Aktifkan Kamera</button><div id="preDiag" class="diag">Tekan tombol, lalu izinkan kamera.</div></div></div>
<div id="ui" class="hidden"><div class="bar"><a class="btn" href="index.html">← Menu</a><a class="btn" href="ar-marker.html">AR Marker</a></div><div class="bottom"><select id="cams" class="select"></select><div id="diag" class="diag">Kamera aktif.</div></div></div>
<script>
const $=id=>document.getElementById(id);let stream=null;const gum=navigator.mediaDevices?.getUserMedia?.bind(navigator.mediaDevices);function out(s,e=false){$('preDiag').textContent=s;$('preDiag').style.color=e?'#ffd5da':'#d1dcea'}async function stop(){stream?.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null}async function open(id){await stop();const c={video:id?{deviceId:{exact:id},width:{ideal:1920},height:{ideal:1080}}:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false};stream=await gum(c);$('video').srcObject=stream;await $('video').play();const tr=stream.getVideoTracks()[0],s=tr.getSettings?.()||{};$('diag').textContent=`${tr.label||'Kamera'} • ${s.width||'?'}×${s.height||'?'} • ${s.facingMode||'-'}`;localStorage.setItem('webar.cameraDeviceId',s.deviceId||id||'')}
async function init(){try{if(!isSecureContext)throw new Error('Gunakan HTTPS.');if(!gum)throw new Error('getUserMedia tidak tersedia.');const p=await gum({video:{facingMode:{ideal:'environment'}},audio:false});p.getTracks().forEach(t=>t.stop());const cams=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');const sel=$('cams');sel.innerHTML='';cams.forEach((d,i)=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||`Kamera ${i+1}`;sel.appendChild(o)});const saved=localStorage.getItem('webar.cameraDeviceId');if(saved&&cams.some(c=>c.deviceId===saved))sel.value=saved;else{const rear=cams.find(c=>/back|rear|environment|belakang/i.test(c.label)&&!/ultra|0\.5|tele|zoom/i.test(c.label));if(rear)sel.value=rear.deviceId}await open(sel.value);$('start').classList.add('hidden');$('ui').classList.remove('hidden')}catch(e){out(`${e.name||'Error'}: ${e.message||e}`,true)}}
$('go').onclick=init;$('cams').onchange=()=>open($('cams').value).catch(e=>$('diag').textContent=`${e.name}: ${e.message}`);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&stream)$('video').play().catch(()=>{})});addEventListener('pagehide',stop);
</script></body></html>
