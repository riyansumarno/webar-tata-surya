<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101c"><title>Tes Kamera WebAR</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050b14;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(760px,calc(100% - 24px));margin:0 auto;padding:22px 0 50px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.btn{border:1px solid #314055;border-radius:999px;background:#0a1523;color:#fff;padding:10px 13px;text-decoration:none;font-weight:700;cursor:pointer}.btn.primary{background:#fff;color:#07111d}.card{border:1px solid #223146;border-radius:18px;background:#091321;padding:16px;margin-top:12px}.card h1{margin:0 0 8px;font-size:24px}.card p{color:#bdcad9;line-height:1.55}.select{width:100%;padding:11px;border-radius:12px;border:1px solid #314055;background:#07101b;color:#fff}.video{margin-top:12px;aspect-ratio:16/10;background:#000;border-radius:14px;overflow:hidden}.video video{width:100%;height:100%;object-fit:cover}.diag{white-space:pre-wrap;font-size:12px;line-height:1.5;color:#c3cedd;background:#050b14;border:1px solid #223146;border-radius:12px;padding:11px;margin-top:12px}.error{color:#ffd7dc;border-color:#66323a;background:#160c0e}</style></head><body><main><div class="bar"><a class="btn" href="index.html">← Menu</a><a class="btn" href="ar-marker.html">AR Marker</a><a class="btn" href="marker.html">Marker</a></div><div class="card"><h1>Tes kamera smartphone</h1><p>Halaman ini hanya menguji kamera browser, tanpa AR.js. Jika kamera bermasalah di sini, masalahnya bukan pada marker tracking.</p><button id="start" class="btn primary">Aktifkan Kamera</button><select id="cams" class="select" disabled style="margin-top:12px"><option>Belum ada kamera</option></select><div class="video"><video id="video" playsinline muted autoplay></video></div><div id="diag" class="diag">Tekan “Aktifkan Kamera”.</div></div></main><script>
const $=id=>document.getElementById(id);let stream=null;const gum=navigator.mediaDevices?.getUserMedia?.bind(navigator.mediaDevices);function out(s,e=false){$('diag').textContent=s;$('diag').classList.toggle('error',e)}async function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null}async function open(id){await stop();const c={video:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}},audio:false};if(id)c.video.deviceId={exact:id};else c.video.facingMode={ideal:'environment'};stream=await gum(c);$('video').srcObject=stream;await $('video').play().catch(()=>{});const t=stream.getVideoTracks()[0],s=t.getSettings?t.getSettings():{};localStorage.setItem('webar.cameraDeviceId',s.deviceId||id||'');localStorage.setItem('webar.cameraLabel',t.label||'');out(`Kamera aktif.\nNama: ${t.label||'-'}\nResolusi: ${s.width||'?'} × ${s.height||'?'}\nFacing mode: ${s.facingMode||'-'}\nDevice ID tersimpan untuk halaman AR.`)}async function init(){if(!gum)return out('getUserMedia tidak tersedia di browser ini.',true);try{if(!isSecureContext)throw new Error('Gunakan HTTPS atau localhost.');const first=await gum({video:{facingMode:{ideal:'environment'}},audio:false});first.getTracks().forEach(t=>t.stop());const all=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');const sel=$('cams');sel.innerHTML='';all.forEach((d,i)=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||`Kamera ${i+1}`;sel.appendChild(o)});sel.disabled=false;const saved=localStorage.getItem('webar.cameraDeviceId');if(saved&&all.some(x=>x.deviceId===saved))sel.value=saved;await open(sel.value);$('start').textContent='✓ Kamera aktif'}catch(e){out(`${e.name||'Error'}: ${e.message||e}`,true)}}$('start').onclick=init;$('cams').onchange=()=>open($('cams').value).catch(e=>out(`${e.name||'Error'}: ${e.message||e}`,true));window.addEventListener('pagehide',stop);
</script></body></html>
